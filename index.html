<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#721819" />
    <title>건, 채림 결혼합니다🩷</title>
    <meta name="description" content="2027.01.09 오후 1시 30분 · 신림 그레이스 파티 7층 그레이스홀" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="건 &amp; 채림 청첩장" />
    <meta property="og:title" content="건, 채림 결혼합니다❤️" />
    <meta property="og:description" content="2027.01.09 오후 1시 30분 · 신림 그레이스 파티 7층 그레이스홀" />
    <meta property="og:url" content="https://notcherry222.github.io/geun-lim/" />
    <meta property="og:image" content="https://notcherry222.github.io/geun-lim/assets/images/og-cover.jpg?v=20261003" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="건과 채림의 웨딩 사진" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="건, 채림 결혼합니다❤️" />
    <meta name="twitter:description" content="2027.01.09 오후 1시 30분 · 신림 그레이스 파티 7층 그레이스홀" />
    <meta name="twitter:image" content="https://notcherry222.github.io/geun-lim/assets/images/og-cover.jpg?v=20261003" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/style.css?v=20261003k" />
  </head>
  <body>
    <main id="app">
      <!-- 1. 대문사진 -->
      <section class="cover" id="cover" aria-label="대문사진">
        <picture class="cover__picture">
          <source srcset="assets/design/cover.webp?v=20261003" type="image/webp" />
          <img
            id="cover-image"
            class="cover__image"
            src="assets/design/cover.png?v=20261003"
            alt="건과 채림의 모바일 청첩장 표지"
            fetchpriority="high"
            decoding="async"
          />
        </picture>
        <div class="cover__placeholder" id="cover-fallback" hidden>대문사진</div>
      </section>

      <!-- 2. Our Wedding Day -->
      <section class="block block--dark wedding" id="wedding" aria-label="Our Wedding Day">
        <p class="heart" aria-hidden="true">♥︎</p>
        <h1 class="en-title">Our Wedding day</h1>

        <figure class="date-card">
          <picture>
            <source srcset="assets/design/datetime-frame.webp?v=20261003" type="image/webp" />
            <img src="assets/design/datetime-frame.png?v=20261003" alt="" loading="lazy" decoding="async" />
          </picture>
        </figure>

        <div class="parents" id="parents-lines"></div>

        <picture class="heart-locket">
          <source srcset="assets/design/heart-frame-cut.webp?v=20261003" type="image/webp" />
          <img src="assets/design/heart-frame-cut.png?v=20261003" alt="" loading="lazy" decoding="async" />
        </picture>

        <figure class="script">
          <picture class="script__paper-picture">
            <source srcset="assets/design/script-paper.webp?v=20261003" type="image/webp" />
            <img
              class="script__paper"
              src="assets/design/script-paper.png?v=20261003b"
              alt=""
              loading="lazy"
              decoding="async"
            />
          </picture>
          <picture class="script__writing">
            <source srcset="assets/design/script-writing.webp?v=20261003" type="image/webp" />
            <img
              class="script__writing-image"
              src="assets/design/script-writing.png?v=20261003b"
              alt="낯선 도시 카우나스에서 시작된 저희의 인연이 서로를 아끼고 존중하며 함께 걸어가려 합니다. 두 사람의 첫걸음을 축복해 주시면 감사하겠습니다."
              loading="lazy"
              decoding="async"
            />
          </picture>
        </figure>
      </section>

      <!-- 4. Gallery -->
      <section class="block block--dark gallery" id="gallery" aria-label="Gallery">
        <p class="heart" aria-hidden="true">♥︎</p>
        <h2 class="en-title">Gallery</h2>
        <div class="stamp-sheet">
          <div class="stamp-collage" id="gallery-grid"></div>
        </div>
      </section>

      <!-- 5. Save the Date -->
      <section class="block block--light save" id="save" aria-label="Save the Date">
        <p class="heart" aria-hidden="true">♥︎</p>
        <h2 class="en-title">Save the Date</h2>
        <p class="ko-sub">예식 안내</p>
        <div class="calendar" id="calendar" aria-label="2027년 1월"></div>
        <p class="save__when" id="save-when"></p>
        <div class="countdown" id="countdown" aria-live="polite">
          <div class="tick"><b id="cd-days">00</b><span>Days</span></div>
          <span class="colon">:</span>
          <div class="tick"><b id="cd-hours">00</b><span>Hours</span></div>
          <span class="colon">:</span>
          <div class="tick"><b id="cd-mins">00</b><span>Min</span></div>
          <span class="colon">:</span>
          <div class="tick"><b id="cd-secs">00</b><span>Sec</span></div>
        </div>
        <p class="save__left" id="save-left"></p>
      </section>

      <!-- 6. Location -->
      <section class="block block--light location" id="location" aria-label="오시는길">
        <p class="heart" aria-hidden="true">♥︎</p>
        <h2 class="en-title">Location</h2>
        <p class="ko-sub">오시는길</p>
        <div class="map-frame">
          <iframe
            id="map-frame"
            title="예식장 위치"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
        <div class="map-links" id="map-links"></div>
        <p class="location__address" id="location-address"></p>
        <div class="transport-guide" id="transport-guide" aria-label="교통 안내"></div>
      </section>

      <!-- 7. Gift -->
      <section class="block block--light gift" id="gift" aria-label="마음 전하실 곳">
        <p class="heart" aria-hidden="true">♥︎</p>
        <h2 class="en-title">With Love</h2>
        <p class="ko-sub">마음 전하실 곳</p>
        <p class="gift__note">
          참석이 어려우신 분들을 위해<br />조심스럽게 안내드립니다.
        </p>
        <p class="gift__note">보내주시는 따뜻한 마음,<br />감사히 간직하겠습니다.</p>
        <div class="accounts" id="accounts-block"></div>

      </section>

      <!-- 8. 감사 인사 -->
      <section class="block block--dark thanks" aria-label="감사 인사">
        <p>
          저희 두 사람의 새로운 시작을<br />
          따뜻한 마음으로 축복해 주시면<br />
          감사하겠습니다.
        </p>
        <p>행복하게 잘 살겠습니다.</p>
        <p class="thanks__sign">신랑 · 신부 올림</p>
        <button type="button" class="thanks__copy" id="copy-url">청첩장 URL 복사</button>
      </section>
    </main>

    <div class="viewer" id="lightbox" hidden>
      <button type="button" class="viewer__close" id="lightbox-close" aria-label="닫기">×</button>
      <div class="viewer__stage">
        <button type="button" class="viewer__nav viewer__nav--prev" id="lightbox-prev" aria-label="이전">‹</button>
        <img class="viewer__image" id="lightbox-image" alt="" draggable="false" />
        <button type="button" class="viewer__nav viewer__nav--next" id="lightbox-next" aria-label="다음">›</button>
      </div>
      <div class="viewer__thumbs" id="lightbox-thumbs"></div>
    </div>

    <div class="toast" id="toast" hidden role="status"></div>

    <script src="js/data.js?v=20261003d"></script>
    <script src="js/app.js?v=20261003j"></script>
  </body>
</html>
