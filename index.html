<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2ec" />
    <title>건, 채림 결혼합니다🩷</title>
    <meta name="description" content="2027.01.09 오후 1시 30분 · 신림 그레이스 파티 7층 그레이스홀" />

    <!-- Open Graph / 카카오·메신저 링크 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="건 &amp; 채림 청첩장" />
    <meta property="og:title" content="건, 채림 결혼합니다❤️" />
    <meta property="og:description" content="2027.01.09 오후 1시 30분 · 신림 그레이스 파티 7층 그레이스홀" />
    <meta property="og:url" content="https://notcherry222.github.io/geun-lim/" />
    <meta property="og:image" content="https://notcherry222.github.io/geun-lim/assets/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="건과 채림의 웨딩 사진" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="건, 채림 결혼합니다❤️" />
    <meta name="twitter:description" content="2027.01.09 오후 1시 30분 · 신림 그레이스 파티 7층 그레이스홀" />
    <meta name="twitter:image" content="https://notcherry222.github.io/geun-lim/assets/images/og-cover.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=20260915b" />
    <link rel="stylesheet" href="css/intro.css?v=20260917b" />
  </head>
  <body>
    <!-- Pixel prologue cutscene (session once) -->
    <div id="intro-balloon" aria-label="프롤로그">
      <button type="button" class="intro__skip">SKIP</button>
      <div class="intro__stage">
        <!-- 0~1s title -->
        <div class="intro__scene intro__scene--title is-active">
          <div>
            <p class="intro__title-year">2019</p>
            <p class="intro__title-place">KAUNAS, LITHUANIA</p>
          </div>
        </div>

        <!-- 1~2.5s meet -->
        <div class="intro__scene intro__scene--meet">
          <div class="intro__map-decor" aria-hidden="true">
            <span class="intro__pixel-cloud intro__pixel-cloud--a"></span>
            <span class="intro__pixel-cloud intro__pixel-cloud--b"></span>
            <span class="intro__castle"></span>
          </div>
          <div class="intro__actors">
            <div class="intro__actor intro__actor--gun">
              <img src="assets/images/intro-gun.svg" alt="" width="48" height="72" draggable="false" />
              <span class="intro__react intro__react--bang">!</span>
              <span class="intro__react intro__react--heart">♥</span>
            </div>
            <div class="intro__actor intro__actor--chaelim">
              <img src="assets/images/intro-chaelim.svg" alt="" width="48" height="72" draggable="false" />
            </div>
          </div>
        </div>

        <!-- 2.5~3.5s years -->
        <div class="intro__scene intro__scene--years">
          <div>
            <div class="intro__timeline">
              <div class="intro__timeline-labels">
                <span>2019</span>
                <span>2027</span>
              </div>
              <div class="intro__timeline-bar">
                <span class="intro__timeline-fill"></span>
              </div>
            </div>
            <p class="intro__later">8 YEARS LATER...</p>
          </div>
        </div>

        <!-- 3.5~5s flight → fade to card -->
        <div class="intro__scene intro__scene--flight">
          <div class="intro__flight-sky" aria-hidden="true">
            <span class="intro__flight-cloud intro__flight-cloud--a"></span>
            <span class="intro__flight-cloud intro__flight-cloud--b"></span>
            <span class="intro__flight-cloud intro__flight-cloud--c"></span>
          </div>
          <div class="intro__flight-copy">
            <p class="intro__flight-names">GUN ♥ CHAELIM</p>
            <p class="intro__flight-date">2027. 01. 09</p>
          </div>
          <div class="intro__ride">
            <img
              class="intro__ride-balloon"
              src="assets/images/intro-balloon.svg"
              alt=""
              width="72"
              height="90"
              draggable="false"
            />
            <div class="intro__ride-pair">
              <img src="assets/images/intro-gun.svg" alt="" width="28" height="42" draggable="false" />
              <img src="assets/images/intro-chaelim.svg" alt="" width="28" height="42" draggable="false" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("geun-lim-intro-seen") === "1") {
            var el = document.getElementById("intro-balloon");
            if (el) el.hidden = true;
          } else {
            document.body.classList.add("is-locked");
          }
        } catch (e) {}
      })();
    </script>

    <main id="app">
      <!-- Hero -->
      <section class="hero" id="hero" aria-label="메인">
        <div class="hero__media">
          <img id="hero-image" class="hero__image" src="" alt="" />
          <div class="hero__shade" aria-hidden="true"></div>
        </div>
        <p class="hero__script" id="hero-script" aria-hidden="true"></p>
        <div class="hero__center">
          <p class="hero__names" id="hero-names"></p>
          <p class="hero__hint">Scroll</p>
          <span class="hero__hint-line" aria-hidden="true"></span>
        </div>
      </section>

      <!-- Invite -->
      <section class="section invite" id="invite">
        <h2 class="section__title" id="invite-heading"></h2>
        <p class="invite__eyebrow" id="invite-eyebrow"></p>
        <figure class="invite__photo">
          <img id="invite-photo" class="invite__photo-img" src="" alt="" />
          <span class="sticker sticker--tape invite__photo-tape" id="invite-tape"></span>
        </figure>
        <div class="invite__body" id="invite-body"></div>
      </section>

      <!-- Parents -->
      <section class="section parents" id="parents">
        <div id="parents-block"></div>
        <button type="button" class="btn btn--ghost" id="btn-contact-parents">
          혼주에게 연락하기
        </button>
      </section>

      <!-- Ceremony -->
      <section class="section ceremony" id="ceremony">
        <h2 class="section__title">예식 안내</h2>
        <p class="ceremony__datetime" id="ceremony-datetime"></p>
        <p class="ceremony__venue" id="ceremony-venue"></p>
        <div class="calendar" id="calendar" aria-label="예식 달력"></div>
      </section>

      <!-- Gallery -->
      <section class="section gallery" id="gallery">
        <h2 class="section__title" id="gallery-heading"></h2>
        <div class="gallery__grid" id="gallery-grid"></div>
        <button type="button" class="btn btn--ghost" id="gallery-more" hidden>
          더 보기
        </button>
      </section>

      <!-- Location -->
      <section class="section location" id="location">
        <h2 class="section__title">오시는 길</h2>
        <div class="location__card">
          <p class="location__name" id="location-name"></p>
          <p class="location__hall" id="location-hall"></p>
          <p class="location__address" id="location-address"></p>
          <div class="location__map" id="location-map" aria-label="약도"></div>
          <div class="location__nav">
            <button type="button" class="btn btn--nav" data-map="tmap">티맵</button>
            <button type="button" class="btn btn--nav" data-map="kakao">카카오내비</button>
            <button type="button" class="btn btn--nav" data-map="naver">네이버지도</button>
          </div>
        </div>
        <div class="location__transit" id="location-transit"></div>
      </section>

      <!-- Accounts -->
      <section class="section accounts" id="accounts">
        <h2 class="section__title" id="accounts-heading"></h2>
        <div class="accounts__cols" id="accounts-block"></div>
      </section>

      <footer class="footer">
        <p>Gun &amp; Chaelim · 2027.01.09</p>
      </footer>
    </main>

    <!-- Parents contact modal -->
    <div class="modal" id="modal-parents" hidden>
      <div class="modal__backdrop" data-close="modal-parents"></div>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="parents-modal-title">
        <h2 class="modal__title" id="parents-modal-title">혼주에게 연락하기</h2>
        <div id="parents-modal-body"></div>
        <button type="button" class="btn btn--ghost" data-close="modal-parents">닫기</button>
      </div>
    </div>

    <!-- Gallery lightbox -->
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox__backdrop" data-close="lightbox"></div>
      <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="이전">
        ‹
      </button>
      <div class="lightbox__stage" id="lightbox-stage">
        <img class="lightbox__image" id="lightbox-image" src="" alt="" />
        <p class="lightbox__counter" id="lightbox-counter" aria-live="polite"></p>
      </div>
      <button type="button" class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="다음">
        ›
      </button>
      <button type="button" class="lightbox__close" data-close="lightbox" aria-label="닫기">×</button>
    </div>

    <div class="toast" id="toast" hidden role="status"></div>

    <script src="js/data.js?v=20260915b"></script>
    <script src="js/app.js?v=20260915b"></script>
    <script src="js/intro.js?v=20260917b"></script>
  </body>
</html>
